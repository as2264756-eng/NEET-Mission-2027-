<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101b2d"><title>NEET Mission 2027 · Study OS</title>
<style>
:root{--bg:#0b1220;--panel:#121e30;--panel2:#18263b;--line:#26364e;--text:#eef4ff;--muted:#91a2ba;--mint:#58e0b2;--blue:#78a9ff;--gold:#ffd477;--red:#ff8585;--shadow:0 18px 45px #0003}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#1b3852 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;transition:.18s}button:hover{border-color:var(--mint);transform:translateY(-1px)}button.primary{background:linear-gradient(135deg,#24b98b,#168b78);border:0;color:#041b17;font-weight:800}button.ghost{background:transparent}button.danger{color:var(--red)}input,select,textarea{width:100%;background:#0c1727;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--mint)}textarea{min-height:110px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,4vw,36px);line-height:1.1;margin-bottom:8px}h2{font-size:20px;margin-bottom:12px}h3{font-size:16px;margin-bottom:7px}.muted,.hint{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.app{max-width:1240px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#62e6bd,#6f9cff);display:grid;place-items:center;color:#071a22;font-weight:1000;font-size:20px;box-shadow:0 8px 24px #58e0b233}.brand small{color:var(--mint);letter-spacing:2px;font-weight:800}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}.side{background:#101b2bce;border:1px solid var(--line);border-radius:20px;padding:12px;height:max-content;position:sticky;top:14px}.navbtn{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:transparent;border:0;color:var(--muted);margin:3px 0}.navbtn.active{background:#20334b;color:var(--mint);border:1px solid #34536a}.navbtn span:first-child{width:23px;text-align:center}.content{min-width:0}.hero{background:linear-gradient(120deg,#163d43,#1b2c4b 70%,#29345b);border:1px solid #315267;border-radius:24px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#58e0b212;right:-65px;top:-90px}.eyebrow{color:var(--mint);font-weight:800;letter-spacing:1.8px;font-size:11px}.hero p{color:#c3d5e8;margin:10px 0 16px}.hero .target{display:inline-flex;padding:7px 11px;background:#071b2d66;border:1px solid #ffffff20;border-radius:30px;color:#d5f7ed;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.card,.stat{background:linear-gradient(145deg,#142238,#101b2b);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 24px #0002}.stat .value{font-size:27px;font-weight:850;letter-spacing:-1px;margin:4px 0}.stat .label{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bar{height:9px;background:#26364b;border-radius:20px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{font-size:11px;padding:4px 8px;border-radius:30px;background:#20344b;color:#bcd4ef;border:1px solid #314761}.pill.green{color:var(--mint);background:#14382f}.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26364e}.task input{width:18px;height:18px;accent-color:var(--mint)}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.listrow{padding:12px 0;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:#1b6657;color:#dffff5;border-color:#2d9d83}.question{font-size:18px;font-weight:700;margin:15px 0}.option{display:block;width:100%;text-align:left;margin:8px 0}.option.correct{border-color:var(--mint);background:#153b32}.option.wrong{border-color:var(--red);background:#40242d}.feedback{padding:12px;border-radius:12px;background:#1a2d40;margin-top:12px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #40516a;border-radius:14px}.timer{font-size:58px;font-weight:900;letter-spacing:-2px;text-align:center;margin:12px}.timer-ring{width:210px;height:210px;border-radius:50%;border:7px solid #28475a;display:grid;place-items:center;margin:15px auto;background:radial-gradient(circle,#172d40,#101b2b)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{padding:8px 2px;text-align:center;border-radius:9px;background:#18263a;font-size:12px}.day.done{background:#14503f;color:#d5ffed}.modalback{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:10}.modal{max-width:540px;width:100%;background:#142238;border:1px solid var(--line);border-radius:20px;padding:20px;max-height:90vh;overflow:auto}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#d7fff0;color:#09271e;padding:10px 16px;border-radius:12px;font-weight:700;display:none;z-index:20}.mobilebar{display:none}.footer{padding:22px 0;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto;gap:5px;padding:8px}.navbtn{width:auto;white-space:nowrap;margin:0;padding:9px}.navbtn span:first-child{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.app{padding:12px}.top{align-items:flex-start}.top-actions button{padding:8px;font-size:12px}.side{border-radius:14px}.grid2,.grid3,.fieldgrid{grid-template-columns:1fr}.hero{padding:20px}.stat{padding:13px}.stat .value{font-size:23px}.timer{font-size:48px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">N</div><div><small>YOUR PERSONAL STUDY OS</small><div style="font-weight:850;font-size:17px">NEET Mission <span style="color:var(--mint)">2027</span></div></div></div><div class="top-actions"><button class="ghost" onclick="toggleLanguage()" id="langBtn">हिंदी</button><button class="ghost" onclick="exportData()">↧ Backup</button><button class="ghost" onclick="document.getElementById('importFile').click()">↥ Restore</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"></div></header>
<div class="layout"><aside class="side" id="nav"></aside><main class="content" id="view"></main></div><div class="footer">NEET Mission 2027 · Personal study companion · Your data stays in this browser unless you export a backup.</div></div>
<div class="toast" id="toast"></div><div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const syllabus={Physics:{11:'Units and measurements|Kinematics|Laws of motion|Work energy and power|Rotational motion|Gravitation|Properties of solids and liquids|Thermodynamics|Kinetic theory|Oscillations and waves',12:'Electrostatics|Current electricity|Magnetic effects of current and magnetism|Electromagnetic induction and AC|Electromagnetic waves|Optics|Dual nature of matter|Atoms and nuclei|Electronic devices|Experimental skills'},Chemistry:{11:'Some basic concepts|Atomic structure|Chemical bonding|Thermodynamics|Equilibrium|Redox reactions|Periodicity|Organic chemistry basics|Hydrocarbons',12:'Solutions|Electrochemistry|Chemical kinetics|P-block elements|D and f block elements|Coordination compounds|Haloalkanes and haloarenes|Alcohols phenols and ethers|Aldehydes ketones and carboxylic acids|Amines|Biomolecules|Practical chemistry'},Biology:{11:'The living world|Biological classification|Plant kingdom|Animal kingdom|Morphology of flowering plants|Anatomy of flowering plants|Structural organisation in animals|Cell: the unit of life|Biomolecules|Cell cycle and cell division|Photosynthesis in higher plants|Respiration in plants|Plant growth and development|Breathing and exchange of gases|Body fluids and circulation|Excretory products and their elimination|Locomotion and movement|Neural control and coordination|Chemical coordination and integration',12:'Reproduction|Genetics and evolution|Biology and human welfare|Biotechnology|Ecology and environment'}};
const seed=[['Physics','Electrostatics','SI unit of electric field?',['N/C','J/C','C/N','Wb'],0,'E = F/q, so unit is newton per coulomb.'],['Physics','Laws of motion','A 2 kg body accelerates at 3 m/s². Net force?',['2 N','3 N','6 N','9 N'],2,'F = ma = 2 × 3 = 6 N.'],['Physics','Current electricity','A 6 Ω resistor carries 2 A. Voltage?',['3 V','12 V','8 V','24 V'],1,'Ohm’s law: V = IR.'],['Chemistry','Chemical kinetics','Unit of first-order rate constant?',['mol/L','s⁻¹','L/mol','mol/s'],1,'For a first-order reaction, k has unit time⁻¹.'],['Chemistry','Solutions','pH of 0.001 M HCl at 25°C?',['1','2','3','11'],2,'pH = −log(10⁻³) = 3.'],['Chemistry','P-block elements','Oxidation state of Mn in KMnO₄?',['+2','+4','+6','+7'],3,'+1 + x − 8 = 0, so x = +7.'],['Biology','Cell cycle and cell division','DNA replication occurs in which phase?',['G1','S','G2','M'],1,'S phase is the synthesis phase.'],['Biology','Excretory products and their elimination','Functional unit of kidney?',['Neuron','Nephron','Alveolus','Villus'],1,'Nephron filters blood and forms urine.'],['Biology','Genetics and evolution','Cross Tt × Tt gives what recessive phenotype ratio?',['0%','25%','50%','75%'],1,'Genotypes TT, Tt, Tt, tt; only tt is recessive.']];
let data={done:{},days:{},notes:'',history:[],mistakes:[],logs:{},mocks:[],plan:[['06:00',90,'Biology – NCERT'],['07:30',30,'Formula revision'],['10:00',90,'Physics – concepts + MCQs'],['14:00',90,'Chemistry – concepts + MCQs'],['16:30',60,'Class 11 backlog'],['19:00',60,'GSEB Board preparation'],['21:00',30,'Daily revision + mistakes']],planDone:{},queue:[],rung:{},questions:[],review:{},studyDates:[],focusSessions:0,challengeDates:[],errorTypes:{},language:'en',targetScore:650};
try{let saved=JSON.parse(localStorage.getItem('neet2027')||'{}');data={...data,...saved};}catch(e){}
data.questions??=[];data.review??={};data.logs??={};data.mocks??=[];data.history??=[];data.mistakes??=[];data.plan??=[];data.queue??=[];data.done??={};data.days??={};data.planDone??={};data.studyDates??=[];
const today=()=>new Date().toISOString().slice(0,10);const day=today();let tab='Home',subject='Biology',grade='12',quiz=[],qi=0,answers=[],finished=false,scoreSaved=false,mode='practice',focusSeconds=1500,focusLeft=1500,focusInterval=null;
const navItems=[['Home','⌂'],['Planner','◷'],['Backlog','↻'],['Chapters','▦'],['Daily log','◫'],['Mocks','▤'],['Rank','↗'],['Practice','✎'],['Focus timer','◉'],['NCERT zone','▣'],['Boards','▤'],['Revision','↺'],['Mistakes','⚑'],['Question bank','＋'],['AI Mentor','✦'],['Daily Challenge','⚡'],['NCERT Test','▤'],['Performance','▥'],['Calendar','▦'],['NEET War Room','🏆']];
function save(){try{localStorage.setItem('neet2027',JSON.stringify(data))}catch(e){toast('Browser storage is full. Export a backup.')}}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}function go(t){tab=t;render()}function allQuestions(){return [...seed,...data.questions]}function keyFor(s,g,c){return s+g+c}function chapterList(){return Object.entries(syllabus).flatMap(([s,g])=>Object.entries(g).flatMap(([y,v])=>v.split('|').map(c=>({s,y,c,key:keyFor(s,y,c)}))))}
function render(){let hiNames={'Home':'होम','Planner':'टाइमटेबल','Backlog':'बैकलॉग','Chapters':'अध्याय','Daily log':'दैनिक पढ़ाई','Mocks':'मॉक टेस्ट','Rank':'रैंक','Practice':'अभ्यास','Focus timer':'फोकस टाइमर','NCERT zone':'NCERT रिविज़न','Boards':'बोर्ड तैयारी','Revision':'रिविज़न','Mistakes':'गलतियाँ','Question bank':'प्रश्न बैंक','AI Mentor':'स्टडी मेंटर','Daily Challenge':'दैनिक चुनौती','NCERT Test':'NCERT टेस्ट','Performance':'प्रदर्शन','Calendar':'कैलेंडर','NEET War Room':'NEET वॉर रूम'};document.getElementById('nav').innerHTML=navItems.map(([n,ic])=>`<button class="navbtn ${tab===n?'active':''}" onclick="go('${n}')"><span>${ic}</span><span>${data.language==='hi'?(hiNames[n]||n):n}</span></button>`).join('');let v=document.getElementById('view');if(tab==='Home')home(v);else if(tab==='Chapters')chapters(v);else if(tab==='Practice')practice(v);else if(tab==='Planner'||tab==='Backlog')planner(v);else if(tab==='Daily log'||tab==='Mocks'||tab==='Rank')records(v);else if(tab==='Focus timer')focus(v);else if(tab==='NCERT zone')ncert(v);else if(tab==='Boards')boards(v);else if(tab==='Revision')revision(v);else if(tab==='Mistakes')mistakes(v);else if(tab==='Question bank')bank(v);else if(tab==='AI Mentor')mentor(v);else if(tab==='Daily Challenge')challenge(v);else if(tab==='NCERT Test')ncertTest(v);else if(tab==='Performance')performance(v);else if(tab==='Calendar')calendarView(v);else if(tab==='NEET War Room')warRoom(v)}
function home(v){let chapters=chapterList(),done=chapters.filter(x=>data.done[x.key]).length,mins=data.logs[day]||0,streak=calcStreak();v.innerHTML=`<section class="hero"><div class="eyebrow">YOUR 2027 MEDICAL DREAM STARTS TODAY</div><h1>Small steps.<br>Big dreams. Future doctor.</h1><p>Consistency beats intensity. Build your score one focused session at a time.</p><span class="target">🎯 Target 650+ / 720 &nbsp;·&nbsp; Daily goal 7 hours</span></section><div class="stats"><div class="stat"><div class="label">STUDY TODAY</div><div class="value">${(mins/60).toFixed(1)}h</div><div class="bar"><i style="width:${Math.min(100,mins/420*100)}%"></i></div><div class="tiny">${mins}/420 minutes</div></div><div class="stat"><div class="label">SYLLABUS DONE</div><div class="value">${Math.round(done/chapters.length*100)}%</div><div class="bar"><i style="width:${done/chapters.length*100}%"></i></div><div class="tiny">${done}/${chapters.length} chapters</div></div><div class="stat"><div class="label">CURRENT STREAK</div><div class="value">🔥 ${streak}</div><div class="tiny">consecutive study days</div></div><div class="stat"><div class="label">BEST MOCK</div><div class="value">${data.mocks.length?Math.max(...data.mocks.map(x=>+x.score)):'—'}</div><div class="tiny">out of 720 marks</div></div></div><div class="section-head"><h2>Today’s mission</h2><span class="pill">${day}</span></div><div class="grid2"><section class="card"><div class="row"><h3>7-hour study checklist</h3><span class="pill green">${Object.values(data.days[day]||{}).filter(Boolean).length}/5</span></div>${['Biology NCERT · 2 hours','Physics concepts and numericals · 2 hours','Chemistry theory and MCQs · 2 hours','Board answer writing · 30 minutes','Mistake revision · 30 minutes'].map((t,i)=>`<label class="task"><input type="checkbox" ${data.days[day]?.[i]?'checked':''} onchange="daily(${i},this.checked)"><span>${t}</span></label>`).join('')}<button class="primary" onclick="go('Daily log')">Log actual study time</button></section><section class="card"><h3>Quick actions</h3><p class="muted">Choose your next productive step.</p><div class="grid2"><button onclick="go('Practice')">✎ Start MCQs</button><button onclick="go('Focus timer')">◉ Focus timer</button><button onclick="go('Chapters')">▦ Chapter tracker</button><button onclick="go('Revision')">↺ Revise due topics</button><button onclick="go('Mocks')">▤ Mock score</button><button onclick="go('NCERT zone')">▣ NCERT facts</button></div><div class="listrow"><span class="tiny">Latest practice</span><strong style="float:right">${data.history.length?data.history.at(-1).score+'/'+data.history.at(-1).total:'No test yet'}</strong></div><div class="listrow"><span class="tiny">Questions in bank</span><strong style="float:right">${allQuestions().length}</strong></div></section></div><div class="section-head"><h2>Class-wise progress</h2><button onclick="go('Chapters')">View syllabus →</button></div><div class="grid2">${[11,12].map(y=>{let a=chapters.filter(x=>x.y==y),d=a.filter(x=>data.done[x.key]).length;return `<section class="card"><div class="row"><h3>Class ${y}</h3><span class="pill">${Math.round(d/a.length*100)}%</span></div><div class="value" style="font-size:25px;font-weight:850">${d}/${a.length}</div><div class="bar"><i style="width:${d/a.length*100}%"></i></div></section>`}).join('')}</div><div class="section-head"><h2>Study streak calendar</h2><button onclick="go('Daily log')">View history</button></div><section class="card">${streakCalendar()}</section>`}
function daily(i,on){data.days[day]??={};data.days[day][i]=on;save();render()}
function chapters(v){let a=chapterList().filter(x=>x.s===subject&&x.y==grade);v.innerHTML=`<section class="card"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">SYLLABUS TRACKER</div><h2>${subject} · Class ${grade}</h2></div><span class="pill">${a.filter(x=>data.done[x.key]).length}/${a.length} done</span></div><div class="tabs">${Object.keys(syllabus).map(s=>`<button class="${subject===s?'active':''}" onclick="subject='${s}';render()">${s}</button>`).join('')}<button class="${grade==='11'?'active':''}" onclick="grade='11';render()">Class 11</button><button class="${grade==='12'?'active':''}" onclick="grade='12';render()">Class 12</button></div>${a.map(x=>`<label class="task"><input type="checkbox" ${data.done[x.key]?'checked':''} onchange="data.done['${x.key}']=this.checked;save();render()"><span style="flex:1;color:var(--text)">${x.c}</span><button onclick="openChapterTest('${x.s}','${x.y}','${x.c}')">Test</button><button onclick="scheduleReview('${x.s}','${x.y}','${x.c}')">↺</button></label>`).join('')}<p class="tiny">Syllabus checklist is a study organizer. Verify the final applicable syllabus with the official NEET information bulletin.</p></section>`}
function startQuiz(list,kind='practice'){quiz=list;qi=0;answers=[];finished=false;scoreSaved=false;mode=kind;render()}function openChapterTest(s,y,c){let list=allQuestions().filter(q=>q[0]===s&&(q[1]===c||q[1].toLowerCase().includes(c.toLowerCase())||c.toLowerCase().includes(q[1].toLowerCase())));if(!list.length){toast('No saved MCQs for this chapter yet. Add questions in Question bank.');return}startQuiz(list,'chapter')}
function practice(v){if(!quiz.length){v.innerHTML=`<section class="card"><div class="eyebrow">ACTIVE RECALL</div><h2>NEET MCQ practice</h2><p class="muted">Choose a subject, difficulty and question count. Questions currently available are shown transparently.</p><div class="fieldgrid"><label>Subject<select id="psub"><option>All</option><option>Biology</option><option>Chemistry</option><option>Physics</option></select></label><label>Difficulty<select id="pdiff"><option>All</option><option>Easy</option><option>Medium</option><option>Hard</option></select></label><label>Question count<select id="pcount"><option>25</option><option>45</option><option>90</option></select></label><label>Test type<select id="ptype"><option>Practice</option><option>Timed drill</option></select></label></div><div class="card" style="margin-top:12px"><div class="row"><strong>Question bank availability</strong><span class="pill">${allQuestions().length} questions</span></div><p class="tiny">Only available questions can be attempted. Add more original questions or import your own to build full chapter tests. The app will not duplicate questions to fake a 25/45/90-question test.</p><button onclick="go('Question bank')">Manage question bank</button></div><button class="primary" onclick="launchPractice()">Start practice →</button></section>`;return}
let q=quiz[qi],ans=answers[qi];if(finished){let correct=quiz.filter((x,i)=>answers[i]===x[4]).length,wrong=answers.filter((x,i)=>x!==undefined&&x!==quiz[i][4]).length,score=correct*4-wrong;if(!scoreSaved){data.history.push({score,total:quiz.length*4,correct,wrong,date:day,subject:mode});if(mode==='daily challenge'&&!(data.challengeDates||[]).includes(day)){data.challengeDates??=[];data.challengeDates.push(day)}scoreSaved=true;save()}v.innerHTML=`<section class="card"><div class="eyebrow">TEST COMPLETED</div><h2>Your performance</h2><div class="stats"><div class="stat"><div class="label">SCORE</div><div class="value">${score}</div></div><div class="stat"><div class="label">CORRECT</div><div class="value">${correct}</div></div><div class="stat"><div class="label">INCORRECT</div><div class="value">${wrong}</div></div><div class="stat"><div class="label">ACCURACY</div><div class="value">${Math.round(correct/quiz.length*100)}%</div></div></div><button class="primary" onclick="quiz=[];go('Practice')">New practice</button> <button onclick="go('Mistakes')">Review mistakes</button></section>${quiz.map((x,i)=>`<section class="card"><div class="tiny">Q${i+1} · ${x[0]} · ${x[1]}</div><strong>${x[2]}</strong><p class="${answers[i]===x[4]?'good':'bad'}">Your answer: ${answers[i]===undefined?'Not attempted':x[3][answers[i]]} · Correct: ${x[3][x[4]]}</p><p class="muted">${x[5]}</p></section>`).join('')}`;return}
v.innerHTML=`<section class="card"><div class="row"><span class="pill">${mode.toUpperCase()}</span><span class="tiny">Question ${qi+1} / ${quiz.length}</span></div><div class="bar"><i style="width:${(qi+1)/quiz.length*100}%"></i></div><div class="tiny" style="margin-top:15px">${q[0]} · ${q[1]}</div><div class="question">${q[2]}</div>${q[3].map((o,i)=>`<button class="option ${ans!==undefined&&i===q[4]?'correct':ans===i?'wrong':''}" ${ans!==undefined?'disabled':''} onclick="pickAnswer(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}${ans!==undefined?`<div class="feedback"><strong>${ans===q[4]?'Correct!':'Correct answer: '+q[3][q[4]]}</strong><p style="margin:6px 0 0">${q[5]}</p>${ans!==q[4]?`<label>Why did you miss it?<select onchange="data.errorTypes['${esc(q[2])}']=this.value;save()"><option value="">Choose error type</option><option>Conceptual gap</option><option>Calculation mistake</option><option>Silly mistake</option><option>Memory / NCERT fact</option><option>Question misread</option></select></label>`:''}</div><div class="row" style="margin-top:14px"><span class="tiny">+4 correct · −1 incorrect</span><button class="primary" onclick="nextQuestion()">${qi===quiz.length-1?'Finish test':'Next question →'}</button></div>`:''}</section>`}

function startDailyChallenge(){let qs=allQuestions().slice().sort(()=>Math.random()-.5).slice(0,30);if(!qs.length){toast('Add questions to your bank first');return}mode='daily challenge';startQuiz(qs,'daily challenge');go('Practice');}

function performance(v){let mocks=data.mocks||[],max=Math.max(720,...mocks.map(x=>+x.score));v.innerHTML=`<section class="card"><div class="eyebrow">TARGET 650+ TRACKER</div><h2>Mock score improvement</h2><label>Personal target score<input id="targetScoreInput" type="number" min="1" max="720" value="${data.targetScore||650}"></label><button onclick="data.targetScore=Math.max(1,Math.min(720,+document.getElementById('targetScoreInput').value||650));save();render()">Save target</button><p class="muted">Actual scores entered by you only. This graph is not a rank prediction.</p>${mocks.length?mocks.map((m,i)=>`<div class="listrow"><div class="row"><strong>${esc(m.name)}</strong><strong>${m.score}/720</strong></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,m.score/720*100))}%"></i></div><div class="tiny">${esc(m.date)} · ${Math.round(m.score/(data.targetScore||650)*100)}% of target</div></div>`).join(''):'<div class="empty">Record mock scores to build your graph.</div>'}<div class="section-head"><h3>Subject-wise mistake count</h3></div>${['Biology','Chemistry','Physics'].map(s=>{let n=allQuestions().filter(q=>q[0]===s&&data.mistakes.includes(q[2])).length;return `<div class="listrow"><div class="row"><span>${s}</span><strong>${n}</strong></div><div class="bar"><i style="width:${Math.min(100,n*10)}%"></i></div></div>`}).join('')}</section>`}
function calendarView(v){let now=new Date(),year=now.getFullYear(),month=now.getMonth(),first=new Date(year,month,1),offset=first.getDay(),days=new Date(year,month+1,0).getDate(),logged=new Set([...Object.keys(data.logs||{}).filter(k=>data.logs[k]>0),...(data.challengeDates||[])]);v.innerHTML=`<section class="card"><div class="eyebrow">CONSISTENCY CALENDAR</div><h2>${now.toLocaleDateString('en',{month:'long',year:'numeric'})}</h2><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="day">${x}</div>`).join('')}${Array.from({length:offset},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{let d=String(year)+'-'+String(month+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0');return `<div class="day ${logged.has(d)?'done':''}">${i+1}${logged.has(d)?' ✓':''}</div>`}).join('')}</div><p class="tiny" style="margin-top:12px">Green days have a saved study log or completed daily challenge.</p><button onclick="go('Daily log')">Add study log</button></section>`}
function warRoom(v){let streak=calcStreak(),days=(data.challengeDates||[]).length,chapters=chapterList(),done=chapters.filter(x=>data.done[x.key]).length,week=Array.from({length:7},(_,i)=>{let d=new Date(day+'T12:00:00');d.setDate(d.getDate()-6+i);let k=d.toISOString().slice(0,10);return {k,ok:(data.logs[k]||0)>0||(data.challengeDates||[]).includes(k)}});let badges=[['First steps',Object.keys(data.logs).length>0],['7-day streak',streak>=7],['10 chapters',done>=10],['First mock',data.mocks.length>0],['Mistake learner',data.mistakes.length>=10],['Challenge starter',days>=1]];v.innerHTML=`<section class="hero"><div class="eyebrow">YOUR PERSONAL NEET WAR ROOM</div><h1>Mission 650+ 🏆</h1><p>Compete with your past self. No fake leaderboard or invented AIR.</p><span class="target">🔥 ${streak}-day streak · ${done}/${chapters.length} chapters checked</span></section><div class="section-head"><h2>7-day consistency challenge</h2><span class="pill">${week.filter(x=>x.ok).length}/7 days</span></div><section class="card"><div class="grid3">${week.map((x,i)=>`<div class="day ${x.ok?'done':''}">${['M','T','W','T','F','S','S'][i]}<br>${x.ok?'✓':'○'}<br><span class="tiny">${x.k.slice(5)}</span></div>`).join('')}</div><p class="tiny" style="margin-top:12px">Log some focused study or complete a daily challenge to mark a day.</p></section><section class="card"><h3>Achievement badges</h3><div class="grid2">${badges.map(([n,ok])=>`<div class="listrow"><span class="pill ${ok?'green':''}">${ok?'UNLOCKED':'LOCKED'}</span><strong style="margin-left:8px">${n}</strong></div>`).join('')}</div></section><section class="card"><h3>War Room controls</h3><div class="grid2"><button onclick="go('AI Mentor')">✦ Study mentor</button><button onclick="go('Daily Challenge')">⚡ Daily challenge</button><button onclick="go('Performance')">▥ Score tracker</button><button onclick="go('Calendar')">▦ Calendar</button></div></section>`}

document.getElementById('langBtn').textContent=data.language==='en'?'हिंदी':'English';
render();
