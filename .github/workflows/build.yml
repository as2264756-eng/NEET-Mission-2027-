
name: Build NEET Mission 2027 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f .github/workflows/NEET-Mission-2027-Android-Project.zip

      - name: Extract Android project
        run: |
          unzip -q .github/workflows/NEET-Mission-2027-Android-Project.zip -d .
          ls -la
          test -d NEET-Mission-2027-Android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p NEET-Mission-2027-Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEET-Mission-2027-APK
          path: NEET-Mission-2027-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
